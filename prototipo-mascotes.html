<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Protótipo — mascotes (S-142 a S-146)</title>
<style>body{margin:0;background:radial-gradient(ellipse at 50% 40%,#4a5a3a,#101410 75%);overflow:hidden;color:#eee;font:13px system-ui}#ui{position:fixed;left:10px;top:10px;background:#000a;padding:8px;border-radius:8px}button{margin:2px}</style>
<script type="importmap">{ "imports": { "three": "./lib/three/three.module.min.js", "three/addons/": "./lib/three/" } }</script>
</head><body><div id="ui"></div>
<script type="module">
import * as THREE from 'three';
import { makePet } from './js3d/pets3d.js';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.02, 100);
scene.add(new THREE.HemisphereLight('#dfeaff', '#5a4a3a', 1.1));
const key = new THREE.DirectionalLight('#fff1dc', 2.6); key.position.set(2, 4, 3); key.castShadow = true; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left=-3;key.shadow.camera.right=3;key.shadow.camera.top=3;key.shadow.camera.bottom=-3; scene.add(key);
const rim = new THREE.DirectionalLight('#9fc4ff', 1.2); rim.position.set(-3, 2, -3); scene.add(rim);
const chk = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); x.fillStyle = '#4f6a3a'; x.fillRect(0, 0, 64, 64); x.fillStyle = '#5c7a44'; x.fillRect(0, 0, 32, 32); x.fillRect(32, 32, 32, 32); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(16, 16); return t; })();
const floor = new THREE.Mesh(new THREE.CircleGeometry(4, 48), new THREE.MeshStandardMaterial({ map: chk, roughness: 1 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const st = { sp: new URLSearchParams(location.search).get('sp') || 'fogo', speed: 0 };
let pets = [];
function rebuild() { for (const p of pets) scene.remove(p.obj); pets = [0, 1, 2].map(i => { const p = makePet(st.sp, i); p.obj.position.x = (i - 1) * 1.3; scene.add(p.obj); return p; }); window.__pets = pets; }
const ui = document.getElementById('ui');
ui.innerHTML = [['fogo', '🦊 Faísca'], ['agua', '🫧 Bolhinha'], ['terra', '🪨 Pedrinho']].map(([s, n]) => `<button data-s="${s}">${n}</button>`).join('') + '<button id="mv">andar</button><button id="run">correr</button><button id="at">atacar</button><div style="font-size:11px;opacity:.7;margin-top:4px">Arraste para girar · roda aproxima · 3 estágios lado a lado · andar/correr: o chão corre por baixo (dá para ver se a pata escorrega)</div>';
ui.onclick = e => { if (e.target.dataset.s) { st.sp = e.target.dataset.s; rebuild(); } if (e.target.id === 'mv') st.speed = st.speed === 0.3 ? 0 : 0.3; if (e.target.id === 'run') st.speed = st.speed === 1 ? 0 : 1; if (e.target.id === 'at') pets.forEach(p => p.attack && p.attack()); };
rebuild();
window.__view = { yaw: 0.6, dist: 4.2, tx: 0, ty: 0.45 };
let t = 0;
window.__frame = (dt = 0.016) => { t += dt; for (const p of pets) { p.animate(t, { speed: st.speed, turn: 0 }, dt); } chk.offset.y -= st.speed * 7.5 * dt / 8 * 16; /* o chão corre por baixo */ const v = window.__view; cam.position.set(v.tx + Math.sin(v.yaw) * v.dist, v.ty + v.dist * 0.25, Math.cos(v.yaw) * v.dist); cam.lookAt(v.tx, v.ty, 0); renderer.render(scene, cam); };
window.__shot = (yaw, dist, tx, ty, steps = 30) => { Object.assign(window.__view, { yaw, dist, tx, ty }); for (let i = 0; i < steps; i++) window.__frame(); return renderer.domElement.toDataURL('image/jpeg', 0.85); };
let drag = false, lx = 0; addEventListener('pointerdown', e => { if (e.target === renderer.domElement) { drag = true; lx = e.clientX; } }); addEventListener('pointerup', () => drag = false); addEventListener('pointermove', e => { if (drag) { window.__view.yaw -= (e.clientX - lx) * 0.01; lx = e.clientX; } }); addEventListener('wheel', e => { window.__view.dist = Math.max(0.8, Math.min(8, window.__view.dist * (e.deltaY > 0 ? 1.1 : 0.9))); });
const clock = new THREE.Clock();
(function loop() { window.__frame(Math.min(0.05, clock.getDelta())); requestAnimationFrame(loop); })();
</script></body></html>
