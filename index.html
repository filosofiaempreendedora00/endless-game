<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crônicas de Aethra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style3d.css">
  <script type="importmap">{ "imports": { "three": "./lib/three/three.module.min.js", "three/addons/": "./lib/three/" } }</script>
</head>
<body class="g3d">
  <canvas id="game3d"></canvas>
  <div id="plates"></div>

  <div id="hud" class="hidden">
    <div id="topbar">
      <div id="status" class="panel">
        <div class="st-top"><span id="st-name"></span><span id="st-class"></span></div>
        <div class="st-lv"><span>Nv. Base <b id="st-blv"></b></span><span>Nv. Classe <b id="st-jlv"></b></span></div>
        <div class="bar hp"><div class="fill" id="bar-hp"></div><span id="txt-hp"></span></div>
        <div class="bar sp"><div class="fill" id="bar-sp"></div><span id="txt-sp"></span></div>
        <div class="bar xp"><div class="fill" id="bar-bxp"></div><span id="txt-bxp"></span></div>
        <div class="bar jxp"><div class="fill" id="bar-jxp"></div><span id="txt-jxp"></span></div>
        <div class="st-zeny">💰 <span id="st-zeny"></span> z</div>
        <div id="st-pet" data-win="tree" title="Ver evolução do mascote (T)"></div>
      <div id="st-alert"></div>
        <div id="st-god" class="hidden">⚡ GOD MODE <span>(Z desliga · ⌘Z painel)</span></div>
      </div>
      <div id="topcol">
        <div id="hotbar"></div>
        <div id="buffs"></div>
        <div id="target3d" class="panel hidden">
          <div class="t-top"><b id="tg-name"></b><span id="tg-lv"></span></div>
          <div class="bar hp"><div class="fill" id="tg-hp"></div><span id="tg-hptxt"></span></div>
          <div id="tg-info"></div>
        </div>
      </div>
    </div>
    <div id="qtrack"></div>
    <div id="minimap-wrap" class="panel">
      <div id="mapname"></div>
      <canvas id="minimap" width="176" height="176"></canvas>
      <div class="mm-zoom"><button id="mm-in" title="Aproximar">+</button><button id="mm-out" title="Afastar">−</button></div>
    </div>
    <div id="menubar">
      <button data-win="char" title="Personagem: equipamento e atributos (C / E)">🧍<span>C</span></button>
      <button data-win="inv" title="Inventário (I)">🎒<span>I</span></button>
      <button data-win="skills" title="Habilidades (K)">📜<span>K</span></button>
      <button data-win="tree" title="Árvore de Classes (T)">🌳<span>T</span></button>
      <button data-win="quests" title="Missões (J)">❗<span>J</span></button>
      <button data-win="bestiario" title="Bestiário — todos os monstros (B)">📖<span>B</span></button>
      <button data-win="loja" title="Loja de Auroras — skins e montarias (O)">✦<span>O</span></button>
      <button data-win="sugestoes" title="Minhas sugestões (L) — Q para fazer uma">💡<span>L</span></button>
      <button data-win="mapa" title="Mapa de Aethra (G)">🗺️<span>G</span></button>
    </div>
    <div id="chat" class="panel">
      <div class="chat-head"><span>💬 Chat <span id="chat-unread"></span></span><button id="chat-min" title="Minimizar / abrir o chat">—</button></div>
      <div id="log"></div>
      <input id="chatinput" maxlength="120" placeholder="Enter para falar • /ajuda para comandos" autocomplete="off">
    </div>
    <div id="err3d"></div>
    <div id="castbar3d" class="hidden"><div class="fill"></div><span></span></div>
  </div>

  <div id="windows"></div>
  <div id="tooltip"></div>
  <div id="banner"></div>
  <div id="pausebar"></div>
  <div id="overlay"></div>
  <div id="loading3d"><div class="ld-title">Crônicas de Aethra</div><div id="ld-txt">Carregando o mundo...</div><div class="ld-bar"><div id="ld-bar"></div></div></div>

  <script src="js/data.js"></script>
  <script src="js/bosses.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/quests.js"></script>
  <script src="js3d/bridge3d.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/admin.js"></script>
  <script type="module" src="js3d/main3d.js"></script>
</body>
</html>
